name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prep
          POSTGRES_PASSWORD: prep
          POSTGRES_DB: prep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prep" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Build sandbox images for all 5 languages (the Docker sandbox tests run for real on the runner)
        run: python -m app.services.sandbox
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests on PostgreSQL with row-level security enforced
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://prep:prep@localhost:5432/prep_test
        run: |
          PGPASSWORD=prep psql -h localhost -U prep -d prep -c "CREATE DATABASE prep_test"
          python -m pytest -q --ignore=tests/test_sandbox_docker.py
      - name: Migrations apply cleanly on PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://prep:prep@localhost:5432/prep
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
