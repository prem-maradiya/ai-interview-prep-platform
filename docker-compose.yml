services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://prep:prep@db:5432/prep
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
    volumes:
      # The API launches sibling sandbox containers through the host Docker daemon.
      # Anything with this socket is root-equivalent on the host: in production, run
      # sandboxes on a separate worker host and/or put a socket proxy in front of it.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8010}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3080}:80"

volumes:
  pgdata:
