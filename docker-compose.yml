x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://prep:prep@db:5432/prep
  REDIS_URL: redis://redis:6379
  SANDBOX_BACKEND: queue
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
  SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    # Apply migrations, then serve. Proxy headers are trusted because only nginx can reach this port.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Runs untrusted code. The only service with the Docker socket: in production, put it on
    # separate hosts (ideally with SANDBOX_RUNTIME=runsc / gVisor) and scale it independently.
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3080}:80"
    restart: unless-stopped

volumes:
  pgdata:
