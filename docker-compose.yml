x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://prep:prep@db:5432/prep
  REDIS_URL: redis://redis:6379
  SANDBOX_BACKEND: queue
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
  SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
  # Social sign-in: a provider is enabled when both its id and secret are set (see README).
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3080}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # Email goes to Mailpit, a local inbox at http://localhost:8025 (nothing leaves your machine).
  # For real delivery set EMAIL_BACKEND=smtp and SMTP_* to your provider in .env.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-PrepForge <no-reply@prepforge.local>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURITY: ${SMTP_SECURITY:-none}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SANDBOX_WARM_POOL: ${SANDBOX_WARM_POOL:-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep
      POSTGRES_DB: prep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep"]
      interval: 3s
      retries: 20
    # Memory caps keep the whole stack around 1.5 GB, so it runs comfortably on an 8 GB laptop.
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    mem_limit: 128m

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    # Apply migrations, then serve. Proxy headers are trusted because only nginx can reach this port.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m

  worker:
    # Runs untrusted code. The only service with the Docker socket: in production, put it on
    # separate hosts (ideally with SANDBOX_RUNTIME=runsc / gVisor) and scale it independently.
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Sandbox containers have their own per-language limits; this caps the worker process itself.
    # On first start it builds the sandbox images (one-time, a few minutes) - see SANDBOX_LANGUAGES.
    mem_limit: 384m

  mailpit:
    # Local test inbox: every email the app sends shows up at http://localhost:8025.
    image: axllent/mailpit:v1.21
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
    mem_limit: 64m

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3080}:80"
    restart: unless-stopped
    mem_limit: 64m

volumes:
  pgdata:
