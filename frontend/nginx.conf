server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Re-resolve "backend" via Docker's DNS so a recreated/rescaled backend container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients can't spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;      # LLM scorecards can take a while
    proxy_buffering off;          # stream interviewer replies (SSE) as they arrive
    client_max_body_size 1m;
  }

  location / {
    try_files $uri /index.html;
  }
}
