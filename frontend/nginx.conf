# WebSocket upgrade for live peer interviews.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Re-resolve "backend" via Docker's DNS so a recreated/rescaled backend container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients can't spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;      # LLM scorecards can take a while
    proxy_buffering off;          # stream interviewer replies (SSE) as they arrive
    client_max_body_size 1m;
  }

  # Metrics are for Prometheus inside the Docker network (backend:8000/api/metrics), never via this
  # public entry point: port publishing can make outside clients look like a private address.
  location = /api/metrics {
    return 404;
  }

  # Peer interview rooms: long-lived WebSockets (the app pings every 25s).
  location ~ ^/api/peer/[^/]+/ws$ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
